<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charadas do Sócrates</title>
    <script src="../game-language.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #ec4899;
            --success: #10b981;
            --danger: #ef4444;
            --dark: #1e293b;
            --light: #f8fafc;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .game-card {
            background: white;
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px;
            text-align: center;
            position: relative;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .timer-badge {
            background: var(--dark);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
        }

        .score-badge {
            color: var(--primary);
        }

        h1 { font-size: 1.8rem; margin-bottom: 0.75rem; color: var(--dark); }

        .quote-container {
            background: #f3f4ff;
            color: #3730a3;
            padding: 1rem 1.2rem;
            margin-bottom: 1rem;
            border-radius: 16px;
            border: 1px solid rgba(99, 102, 241, 0.2);
            font-style: italic;
            min-height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .question-container {
            background: var(--light);
            padding: 1.5rem;
            border-radius: 16px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            border: 2px solid #e2e8f0;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .audio-control {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
            font-size: 0.95rem;
            color: #334155;
        }

        .audio-status {
            background: #f1f5f9;
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid #cbd5e1;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-main { background: var(--primary); color: white; grid-column: span 2; }
        .btn-hint { background: #fef3c7; color: #92400e; }
        .btn-next { background: var(--dark); color: white; }
        .btn-menu {
            display: block;
            grid-column: span 2;
            padding: 12px;
            border-radius: 12px;
            background: #334155;
            color: white;
            font-weight: 600;
            text-decoration: none;
        }

        .answer-options {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-top: 12px;
        }

        .answer-option {
            min-height: 52px;
            padding: 10px;
            background: #f1f5f9;
            color: var(--dark);
            border: 1px solid #cbd5e1;
            overflow-wrap: anywhere;
        }

        .answer-option:hover:not(:disabled) {
            background: #e2e8f0;
        }

        .answer-option.correct,
        .answer-option.correct:hover {
            background: var(--success);
            color: white;
        }

        .answer-option.wrong,
        .answer-option.wrong:hover {
            background: var(--danger);
            color: white;
        }

        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        #feedback {
            margin-top: 15px;
            font-weight: 600;
            min-height: 20px;
            line-height: 1.4;
        }
    </style>
    <link rel="stylesheet" href="../site-preferences.css">
    <script src="../site-preferences.js"></script>
</head>
<body>

<div class="game-card">
    <div class="stats-bar">
        <span class="score-badge">Pontos: <span id="score">0</span> | Total: <span data-score-total="charadas">0</span></span>
        <span class="timer-badge" id="timer">15s</span>
    </div>

    <h1>Charadas do Sócrates</h1>

    <div class="quote-container" id="quote">
        “Conhece-te a ti mesmo.” — Sócrates
    </div>

    <div class="question-container" id="question">
        Clique em começar para jogar!
    </div>

    <div id="answer-options" class="answer-options" role="group" aria-label="Escolha uma das quatro alternativas"></div>
    
    <div id="feedback"></div>

    <div class="controls">
        <button id="startBtn" class="btn-main" onclick="startGame()">Começar Charadas</button>
        <button id="hintBtn" class="btn-hint" onclick="getHint()" disabled>Dica</button>
        <button id="nextBtn" class="btn-next" onclick="nextQuestion()" disabled>Próxima</button>
        <a class="btn-menu" href="../index.html?menu=1" target="_top">Voltar ao Menu</a>
    </div>
    <div class="audio-control">
        <button id="soundToggleBtn" class="btn-hint" onclick="toggleSound()" disabled>🔊 Mudo</button>
        <span class="audio-status" id="audioStatus">Trilha desligada</span>
    </div>
    <audio id="bgm" src="../sons/charadas-bgm.mp3" loop preload="metadata"></audio>
</div>

<script src="../score-counter.js"></script>
<script>
    const riddleLanguages = ['pt-BR', 'en', 'es', 'de', 'ja', 'ru', 'fr', 'it'];
    const riddleSource = [
        ['rain', ['O que cai em pé e corre deitado?', 'What falls standing and runs lying down?', '¿Qué cae de pie y corre acostado?', 'Was fällt stehend und läuft liegend?', '立って落ち、横になって流れるものは？', 'Что падает стоя и бежит лёжа?', 'Qu’est-ce qui tombe debout et coule couché ?', 'Cosa cade in piedi e scorre sdraiata?'], ['chuva', 'rain', 'lluvia', 'Regen', '雨', 'дождь', 'pluie', 'pioggia']],
        ['pineapple', ['Tem coroa, mas não é rei; tem escamas, mas não é peixe. O que é?', 'It has a crown but is not a king; it has scales but is not a fish. What is it?', 'Tiene corona, pero no es rey; tiene escamas, pero no es pez. ¿Qué es?', 'Es hat eine Krone, ist aber kein König; es hat Schuppen, ist aber kein Fisch. Was ist es?', '王冠があり、うろこもあるけれど、王様でも魚でもないものは？', 'У него есть корона, но это не король; есть чешуя, но это не рыба. Что это?', 'Il a une couronne, mais ce n’est pas un roi ; des écailles, mais ce n’est pas un poisson. Qu’est-ce ?', 'Ha una corona ma non è un re; ha squame ma non è un pesce. Che cos’è?'], ['abacaxi', 'pineapple', 'piña', 'Ananas', 'パイナップル', 'ананас', 'ananas', 'ananas']],
        ['hole', ['O que fica maior quanto mais se tira?', 'What gets bigger the more you take away?', '¿Qué se hace más grande cuanto más le quitas?', 'Was wird größer, je mehr man wegnimmt?', '取れば取るほど大きくなるものは？', 'Что становится больше, чем больше из него убирают?', 'Qu’est-ce qui grandit à mesure qu’on en retire ?', 'Che cosa diventa più grande quanto più ne togli?'], ['buraco', 'hole', 'agujero', 'Loch', '穴', 'дыра', 'trou', 'buco']],
        ['comb', ['O que tem dentes, mas não morde?', 'What has teeth but never bites?', '¿Qué tiene dientes, pero no muerde?', 'Was hat Zähne, beißt aber nicht?', '歯があるのに、かまないものは？', 'Что имеет зубцы, но не кусается?', 'Qu’est-ce qui a des dents, mais ne mord pas ?', 'Che cosa ha i denti ma non morde?'], ['pente', 'comb', 'peine', 'Kamm', 'くし', 'расчёска', 'peigne', 'pettine']],
        ['needle', ['O que tem um olho, mas não consegue ver?', 'What has an eye but cannot see?', '¿Qué tiene un ojo, pero no puede ver?', 'Was hat ein Auge, kann aber nicht sehen?', '目があるのに見えないものは？', 'Что имеет глаз, но не может видеть?', 'Qu’est-ce qui a un œil, mais ne peut pas voir ?', 'Che cosa ha un occhio ma non può vedere?'], ['agulha', 'needle', 'aguja', 'Nadel', '針', 'игла', 'aiguille', 'ago']],
        ['towel', ['O que fica mais molhado enquanto seca?', 'What gets wetter as it dries?', '¿Qué se moja más mientras seca?', 'Was wird nasser, während es trocknet?', '乾かすほどぬれるものは？', 'Что становится мокрее, пока сушит?', 'Qu’est-ce qui devient plus mouillé en séchant ?', 'Che cosa si bagna mentre asciuga?'], ['toalha', 'towel', 'toalla', 'Handtuch', 'タオル', 'полотенце', 'serviette', 'asciugamano']],
        ['silence', ['O que se quebra no momento em que você diz seu nome?', 'What is broken the moment you say its name?', '¿Qué se rompe en cuanto dices su nombre?', 'Was zerbricht, sobald man seinen Namen ausspricht?', '名前を口にした瞬間に壊れるものは？', 'Что нарушается, как только произнесёшь его название?', 'Qu’est-ce qui se brise dès qu’on prononce son nom ?', 'Che cosa si rompe appena ne pronunci il nome?'], ['silêncio', 'silence', 'silencio', 'Stille', '沈黙', 'тишина', 'silence', 'silenzio']],
        ['tomorrow', ['O que está sempre por vir, mas nunca chega?', 'What is always coming but never arrives?', '¿Qué está siempre por venir, pero nunca llega?', 'Was kommt immer, kommt aber nie an?', 'いつも来るはずなのに、決して来ないものは？', 'Что всегда наступает, но никогда не приходит?', 'Qu’est-ce qui arrive toujours, mais n’arrive jamais ?', 'Che cosa sta sempre per arrivare ma non arriva mai?'], ['amanhã', 'tomorrow', 'mañana', 'morgen', '明日', 'завтра', 'demain', 'domani']],
        ['clock', ['O que tem rosto e mãos, mas não tem olhos nem braços?', 'What has a face and hands but no eyes or arms?', '¿Qué tiene cara y manecillas, pero no ojos ni brazos?', 'Was hat ein Zifferblatt und Zeiger, aber keine Augen und Arme?', '文字盤と針があるのに、目も腕もないものは？', 'Что имеет циферблат и стрелки, но не имеет глаз и рук?', 'Qu’est-ce qui a un cadran et des aiguilles, mais ni yeux ni bras ?', 'Che cosa ha un quadrante e delle lancette, ma non ha occhi né braccia?'], ['relógio', 'clock', 'reloj', 'Uhr', '時計', 'часы', 'horloge', 'orologio']],
        ['river', ['O que tem leito, mas nunca dorme?', 'What has a bed but never sleeps?', '¿Qué tiene cauce, pero nunca duerme?', 'Was hat ein Bett, schläft aber nie?', 'ベッドがあるのに眠らないものは？', 'Что имеет русло, но никогда не спит?', 'Qu’est-ce qui a un lit, mais ne dort jamais ?', 'Che cosa ha un letto ma non dorme mai?'], ['rio', 'river', 'río', 'Fluss', '川', 'река', 'rivière', 'fiume']],
        ['map', ['O que tem cidades, rios e montanhas, mas não tem casas, água ou árvores?', 'What has cities, rivers, and mountains, but no houses, water, or trees?', '¿Qué tiene ciudades, ríos y montañas, pero no casas, agua ni árboles?', 'Was hat Städte, Flüsse und Berge, aber keine Häuser, kein Wasser und keine Bäume?', '町や川や山があるのに、家も水も木もないものは？', 'Что имеет города, реки и горы, но не имеет домов, воды и деревьев?', 'Qu’est-ce qui a des villes, des rivières et des montagnes, mais ni maisons, ni eau, ni arbres ?', 'Che cosa ha città, fiumi e montagne, ma non case, acqua o alberi?'], ['mapa', 'map', 'mapa', 'Karte', '地図', 'карта', 'carte', 'mappa']],
        ['sponge', ['O que tem muitos furos, mas ainda consegue segurar água?', 'What has many holes but can still hold water?', '¿Qué tiene muchos agujeros y aun así puede retener agua?', 'Was hat viele Löcher und kann trotzdem Wasser halten?', '穴がたくさんあるのに、水をためられるものは？', 'Что имеет много дырок, но всё же удерживает воду?', 'Qu’est-ce qui a beaucoup de trous, mais peut quand même retenir l’eau ?', 'Che cosa ha molti buchi ma riesce comunque a trattenere l’acqua?'], ['esponja', 'sponge', 'esponja', 'Schwamm', 'スポンジ', 'губка', 'éponge', 'spugna']]
    ];
    const riddles = riddleSource.map(([id, questions, answers]) => ({
        id,
        q: questions[riddleLanguages.indexOf(BuuroGameLanguage.language)],
        a: answers[riddleLanguages.indexOf(BuuroGameLanguage.language)]
    }));
    const languageIndex = riddleLanguages.indexOf(BuuroGameLanguage.language);

    let currentRiddle = null;
    let previousRiddle = null;
    let score = 0;
    let timeLeft = 15;
    let timerInterval = null;
    let remainingRiddles = [];

    const questionEl = document.getElementById('question');
    const quoteEl = document.getElementById('quote');
    const answerOptionsEl = document.getElementById('answer-options');
    const scoreEl = document.getElementById('score');
    const timerEl = document.getElementById('timer');
    const feedbackEl = document.getElementById('feedback');
    const bgmEl = document.getElementById('bgm');
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    const audioStatus = document.getElementById('audioStatus');
    answerOptionsEl.setAttribute('aria-label', [
        'Escolha uma das quatro alternativas',
        'Choose one of the four options',
        'Elige una de las cuatro opciones',
        'Wähle eine von vier Antworten',
        '4つの選択肢から1つ選んでください',
        'Выберите один из четырёх вариантов',
        'Choisissez l’une des quatre réponses',
        'Scegli una delle quattro opzioni'
    ][languageIndex]);

    function shuffleArray(array) {
        const copy = array.slice();
        for (let i = copy.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
    }

    function refillRiddles() {
        remainingRiddles = shuffleArray(riddles);
    }

    const quotes = [
        ['Conhece-te a ti mesmo.', 'Know thyself.', 'Conócete a ti mismo.', 'Erkenne dich selbst.', '汝自身を知れ。', 'Познай самого себя.', 'Connais-toi toi-même.', 'Conosci te stesso.'],
        ['Só sei que nada sei.', 'I know that I know nothing.', 'Solo sé que no sé nada.', 'Ich weiß, dass ich nichts weiß.', '私が知っているのは、自分が何も知らないということだ。', 'Я знаю, что ничего не знаю.', 'Je sais que je ne sais rien.', 'So di non sapere nulla.'],
        ['A vida não examinada não vale a pena ser vivida.', 'The unexamined life is not worth living.', 'Una vida sin examen no merece ser vivida.', 'Ein ungeprüftes Leben ist nicht lebenswert.', '吟味されない人生は生きるに値しない。', 'Неосмысленная жизнь не стоит того, чтобы жить.', 'Une vie sans examen ne vaut pas la peine d’être vécue.', 'Una vita senza ricerca non è degna di essere vissuta.'],
        ['O verdadeiro conhecimento vem da reflexão.', 'True knowledge comes from reflection.', 'El verdadero conocimiento nace de la reflexión.', 'Wahre Erkenntnis entsteht durch Nachdenken.', '真の知識は省察から生まれる。', 'Истинное знание рождается в размышлении.', 'La vraie connaissance vient de la réflexion.', 'La vera conoscenza nasce dalla riflessione.'],
        ['A educação é acender uma chama, não encher um vaso.', 'Education is the kindling of a flame, not the filling of a vessel.', 'La educación consiste en encender una llama, no en llenar un recipiente.', 'Bildung entzündet eine Flamme, statt ein Gefäß zu füllen.', '教育とは器を満たすことではなく、炎を灯すことだ。', 'Образование — это зажечь огонь, а не наполнить сосуд.', 'L’éducation consiste à allumer une flamme, non à remplir un vase.', 'L’istruzione accende una fiamma, non riempie un vaso.'],
        ['O maior desafio é conhecer a si mesmo.', 'The greatest challenge is to know yourself.', 'El mayor desafío es conocerse a uno mismo.', 'Die größte Herausforderung ist, sich selbst zu erkennen.', '最大の課題は自分自身を知ることだ。', 'Самое трудное — познать себя.', 'Le plus grand défi est de se connaître soi-même.', 'La sfida più grande è conoscere sé stessi.'],
        ['A alegria nasce da virtude.', 'Joy springs from virtue.', 'La alegría nace de la virtud.', 'Freude entspringt der Tugend.', '喜びは徳から生まれる。', 'Радость рождается из добродетели.', 'La joie naît de la vertu.', 'La gioia nasce dalla virtù.'],
        ['A sabedoria começa na admiração.', 'Wisdom begins in wonder.', 'La sabiduría comienza con el asombro.', 'Weisheit beginnt mit dem Staunen.', '知恵は驚きから始まる。', 'Мудрость начинается с удивления.', 'La sagesse commence par l’émerveillement.', 'La saggezza comincia dalla meraviglia.'],
        ['A medida do amor é amar sem medida.', 'The measure of love is to love without measure.', 'La medida del amor es amar sin medida.', 'Das Maß der Liebe ist, maßlos zu lieben.', '愛の尺度は、限りなく愛することだ。', 'Мера любви — любить без меры.', 'La mesure de l’amour est d’aimer sans mesure.', 'La misura dell’amore è amare senza misura.'],
        ['Seja lento para falar e rápido para agir.', 'Be slow to speak and quick to act.', 'Habla despacio y actúa con rapidez.', 'Sprich langsam und handle schnell.', '話すのはゆっくり、行動はすばやく。', 'Не спеши говорить, но действуй быстро.', 'Parle lentement et agis vite.', 'Parla lentamente e agisci in fretta.']
    ].map((row) => row[languageIndex]);
    const socratesNames = ['Sócrates', 'Socrates', 'Sócrates', 'Sokrates', 'ソクラテス', 'Сократ', 'Socrate', 'Socrate'];
    const startPrompts = [
        'Clique em começar para jogar!', 'Click Start to begin!', '¡Pulsa Empezar para jugar!', 'Klicke auf Start, um zu beginnen!', '開始を押してゲームを始めましょう！', 'Нажмите «Начать», чтобы играть!', 'Cliquez sur Commencer pour jouer !', 'Premi Inizia per giocare!'
    ];
    questionEl.innerText = startPrompts[languageIndex];

    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    let quoteRotationTimer = null;

    function activateAudio() {
        if (!audioContext) return Promise.resolve(false);
        if (audioContext.state === 'running') return Promise.resolve(true);
        return audioContext.resume().then(() => true).catch(() => false);
    }

    document.body.addEventListener('click', () => activateAudio(), { once: true });

    function playTone(frequency, duration, type = 'sine', volume = 0.08) {
        if (!audioContext) return;
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();

        oscillator.type = type;
        oscillator.frequency.value = frequency;
        gainNode.gain.setValueAtTime(volume, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + duration / 1000);

        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);

        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + duration / 1000);
    }

    function playCorrectSound() {
        activateAudio().then((ok) => {
            if (!ok) return;
            playTone(880, 120, 'triangle', 0.15);
            setTimeout(() => playTone(1047, 130, 'triangle', 0.12), 140);
            setTimeout(() => playTone(1319, 90, 'triangle', 0.1), 280);
        });
    }

    function playWrongSound() {
        activateAudio().then((ok) => {
            if (!ok) return;
            playTone(220, 180, 'sawtooth', 0.18);
            setTimeout(() => playTone(165, 180, 'sawtooth', 0.14), 220);
        });
    }

    function startBackgroundMusic() {
        activateAudio().then((ok) => {
            if (!ok || !bgmEl) return;
            bgmEl.volume = 0.22;
            bgmEl.muted = false;
            bgmEl.play().catch(() => {
                // Autoplay pode ser bloqueado, mas o usuário já interagiu com o botão de início.
            });
            updateSoundButton();
        });
    }

    function stopBackgroundMusic() {
        if (bgmEl && !bgmEl.paused) {
            bgmEl.pause();
        }
    }

    function toggleSound() {
        if (!bgmEl) return;
        if (bgmEl.paused) {
            startBackgroundMusic();
            audioStatus.innerText = 'Trilha ligada';
        } else {
            bgmEl.pause();
            audioStatus.innerText = 'Trilha pausada';
        }
        updateSoundButton();
    }

    function updateSoundButton() {
        if (!bgmEl) return;
        soundToggleBtn.innerText = bgmEl.paused ? '🔇 Ligar' : '🔊 Desligar';
        audioStatus.innerText = bgmEl.paused ? 'Trilha pausada' : 'Trilha ligada';
    }

    function rotateQuotes() {
        clearInterval(quoteRotationTimer);
        quoteRotationTimer = setInterval(updateQuote, 9000);
    }

    function updateQuote() {
        const quote = quotes[Math.floor(Math.random() * quotes.length)];
        quoteEl.innerText = `"${quote}" — ${socratesNames[languageIndex]}`;
    }

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 15;
        timerEl.innerText = timeLeft + "s";
        timerEl.style.background = "var(--dark)";

        timerInterval = setInterval(() => {
            timeLeft--;
            timerEl.innerText = timeLeft + "s";
            if (timeLeft <= 5) timerEl.style.background = "var(--danger)";
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                gameOver("Tempo esgotado!");
            }
        }, 1000);
    }

    function startGame() {
        score = 0;
        scoreEl.innerText = score;
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('hintBtn').disabled = false;
        document.getElementById('nextBtn').disabled = false;
        soundToggleBtn.disabled = false;
        updateSoundButton();
        updateQuote();
        rotateQuotes();
        refillRiddles();
        startBackgroundMusic();
        nextQuestion();
    }

    function nextQuestion() {
        if (remainingRiddles.length === 0) {
            refillRiddles();
        }

        answerOptionsEl.innerHTML = '';
        feedbackEl.innerText = "";
        feedbackEl.style.color = "var(--dark)";

        updateQuote();
        let nextRiddle = remainingRiddles.pop();
        while (previousRiddle && nextRiddle && nextRiddle.q === previousRiddle.q && remainingRiddles.length > 0) {
            const tempRiddle = nextRiddle;
            nextRiddle = remainingRiddles.pop();
            remainingRiddles.unshift(tempRiddle);
        }

        currentRiddle = nextRiddle || remainingRiddles.pop();
        previousRiddle = currentRiddle;
        questionEl.innerText = currentRiddle.q;
        createAnswerOptions();
        startTimer();
    }

    function createAnswerOptions() {
        const distractors = shuffleArray(riddles.filter(({ id }) => id !== currentRiddle.id)).slice(0, 3);
        const options = shuffleArray([currentRiddle, ...distractors]);

        options.forEach((option) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'answer-option';
            button.textContent = option.a;
            button.dataset.answerId = option.id;
            button.addEventListener('click', () => checkAnswer(option.id, button));
            answerOptionsEl.appendChild(button);
        });
    }

    function checkAnswer(selectedId, selectedButton) {
        if (!currentRiddle || selectedButton.disabled) return;
        const optionButtons = [...answerOptionsEl.querySelectorAll('button')];
        optionButtons.forEach((button) => { button.disabled = true; });

        if (selectedId === currentRiddle.id) {
            selectedButton.classList.add('correct');
            const earnedPoints = 10 + timeLeft;
            score += earnedPoints;
            GameScoreCounter.add('charadas', earnedPoints);
            scoreEl.innerText = score;
            feedbackEl.innerText = [
                `✨ Correto! + ${earnedPoints} pts`,
                `✨ Correct! + ${earnedPoints} pts`,
                `✨ ¡Correcto! + ${earnedPoints} pts`,
                `✨ Richtig! + ${earnedPoints} Punkte`,
                `✨ 正解！+${earnedPoints}点`,
                `✨ Верно! + ${earnedPoints} очков`,
                `✨ Correct ! + ${earnedPoints} pts`,
                `✨ Corretto! + ${earnedPoints} punti`
            ][languageIndex];
            feedbackEl.style.color = "var(--success)";
            clearInterval(timerInterval);
            playCorrectSound();
            setTimeout(nextQuestion, 1500);
        } else {
            selectedButton.classList.add('wrong');
            const correctButton = optionButtons.find((button) => button.dataset.answerId === currentRiddle.id);
            if (correctButton) correctButton.classList.add('correct');
            gameOver('Resposta incorreta!');
        }
    }

    function gameOver(msg) {
        answerOptionsEl.querySelectorAll('button').forEach((button) => { button.disabled = true; });
        const localizedMessage = msg === 'Tempo esgotado!' ? [
            'Tempo esgotado!', 'Time is up!', '¡Se acabó el tiempo!', 'Die Zeit ist abgelaufen!', '時間切れ！', 'Время вышло!', 'Temps écoulé !', 'Tempo scaduto!'
        ][languageIndex] : [
            'Resposta incorreta!', 'Wrong answer!', '¡Respuesta incorrecta!', 'Falsche Antwort!', '不正解！', 'Неверный ответ!', 'Mauvaise réponse !', 'Risposta errata!'
        ][languageIndex];
        feedbackEl.innerText = [
            `${localizedMessage} A resposta era: ${currentRiddle.a}`,
            `${localizedMessage} The answer was: ${currentRiddle.a}`,
            `${localizedMessage} La respuesta era: ${currentRiddle.a}`,
            `${localizedMessage} Die Antwort war: ${currentRiddle.a}`,
            `${localizedMessage} 答えは${currentRiddle.a}でした`,
            `${localizedMessage} Ответ: ${currentRiddle.a}`,
            `${localizedMessage} La réponse était : ${currentRiddle.a}`,
            `${localizedMessage} La risposta era: ${currentRiddle.a}`
        ][languageIndex];
        feedbackEl.style.color = "var(--danger)";
        playWrongSound();
        setTimeout(nextQuestion, 3000);
    }

    function getHint() {
        feedbackEl.innerText = [
            `Dica: Começa com "${currentRiddle.a[0].toUpperCase()}"`,
            `Hint: Starts with "${currentRiddle.a[0].toUpperCase()}"`,
            `Pista: Empieza por "${currentRiddle.a[0].toUpperCase()}"`,
            `Hinweis: Beginnt mit „${currentRiddle.a[0].toUpperCase()}“`,
            `ヒント：「${currentRiddle.a[0].toUpperCase()}」から始まります`,
            `Подсказка: начинается на «${currentRiddle.a[0].toUpperCase()}»`,
            `Indice : commence par « ${currentRiddle.a[0].toUpperCase()} »`,
            `Suggerimento: inizia con "${currentRiddle.a[0].toUpperCase()}"`
        ][languageIndex];
        feedbackEl.style.color = "#92400e";
        score = Math.max(0, score - 5);
        scoreEl.innerText = score;
    }

    updateQuote();
    if (soundToggleBtn) {
        soundToggleBtn.disabled = true;
    }
</script>

</body>
</html>
