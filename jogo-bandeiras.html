<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivinhe a Bandeira</title>
    <script src="game-language.js"></script>
    <style>
        :root {
            --ink: #172033;
            --green: #287a67;
            --gold: #f5c542;
            --orange: #e87932;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--ink);
            background: #000;
            font-family: Georgia, "Times New Roman", serif;
        }

        .game {
            width: min(720px, 100%);
            min-height: 590px;
            padding: clamp(24px, 5vw, 42px);
            border: 2px solid rgba(245,197,66,0.72);
            border-radius: 8px;
            background: linear-gradient(145deg, rgba(40,122,103,0.96), rgba(18,54,70,0.97) 58%, rgba(232,121,50,0.88));
            box-shadow: 0 24px 70px rgba(245,197,66,0.12);
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 22px;
        }

        .topbar a {
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 0.86rem;
            font-weight: 800;
            text-decoration: none;
        }

        .stats { display: flex; align-items: center; gap: 8px; }

        .music-button {
            min-height: 38px;
            border: 1px solid rgba(255,224,122,0.42);
            border-radius: 6px;
            background: rgba(255,224,122,0.16);
            color: #fff;
            padding: 0 10px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 0.78rem;
            font-weight: 800;
        }

        .music-status {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
        }

        .stat {
            min-width: 82px;
            border: 1px solid rgba(245,197,66,0.32);
            border-radius: 6px;
            padding: 8px 10px;
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 0.78rem;
            color: rgba(255,255,255,0.78);
        }

        .stat strong {
            display: block;
            margin-top: 2px;
            color: #fff;
            font-size: 1.05rem;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: #ffe07a;
            font-family: Arial, sans-serif;
            font-size: 0.78rem;
            font-weight: 900;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 18px;
            color: #fff;
            font-size: clamp(1.8rem, 5vw, 3.1rem);
            line-height: 1.08;
        }

        .flag-wrap {
            height: 220px;
            display: grid;
            place-items: center;
            margin-bottom: 20px;
            border: 2px solid rgba(255,224,122,0.65);
            border-radius: 8px;
            background:
                linear-gradient(45deg, rgba(23,32,51,0.035) 25%, transparent 25%, transparent 75%, rgba(23,32,51,0.035) 75%),
                linear-gradient(45deg, rgba(23,32,51,0.035) 25%, transparent 25%, transparent 75%, rgba(23,32,51,0.035) 75%),
                #ffe7ad;
            background-position: 0 0, 12px 12px;
            background-size: 24px 24px;
        }

        .flag {
            max-width: 82%;
            max-height: 170px;
            width: auto;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 10px 18px rgba(23,32,51,0.16));
        }

        .options {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .option {
            min-height: 62px;
            border: 1px solid rgba(255,224,122,0.42);
            border-radius: 6px;
            background: rgba(255,255,255,0.12);
            color: #fff;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 1rem;
            font-weight: 800;
            transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
        }

        .option:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: #ffe07a;
            background: rgba(245,197,66,0.22);
        }

        .option.correct { border-color: #ffe07a; background: rgba(245,197,66,0.32); }
        .option.wrong { border-color: #ff9179; background: rgba(184,75,67,0.38); }
        .option:disabled { cursor: default; }

        .feedback {
            min-height: 42px;
            margin: 14px 0 8px;
            color: rgba(255,255,255,0.82);
            font-family: Arial, sans-serif;
            line-height: 1.45;
        }

        .next {
            display: none;
            width: 100%;
            min-height: 48px;
            border: 0;
            border-radius: 6px;
            background: linear-gradient(90deg, #1f765d, #e87932);
            color: #fff;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-weight: 900;
        }

        .next.visible { display: block; }

        .finish {
            display: none;
            text-align: center;
            padding-top: 70px;
        }

        .finish.visible { display: block; }

        .finish h2 {
            margin: 18px 0 8px;
            font-size: clamp(2.2rem, 7vw, 4.2rem);
        }

        .finish p { color: rgba(255,255,255,0.82); font-family: Arial, sans-serif; }

        .finish button {
            min-height: 48px;
            margin-top: 16px;
            border: 0;
            border-radius: 6px;
            padding: 0 24px;
            background: linear-gradient(90deg, #f5c542, #e87932);
            color: #fff;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-weight: 900;
        }

        @media (max-width: 560px) {
            body { padding: 12px; }
            .game { min-height: calc(100vh - 24px); padding: 20px 16px; }
            .topbar { align-items: flex-start; }
            .stats { flex-direction: column; align-items: flex-end; }
            .stat { min-width: 74px; }
            .flag-wrap { height: 180px; }
            .flag { max-height: 130px; }
            .options { grid-template-columns: 1fr; }
            .option { min-height: 54px; }
        }
    </style>
    <link rel="stylesheet" href="site-preferences.css">
    <script src="site-preferences.js"></script>
</head>
<body>
    <main class="game">
        <div class="topbar">
            <a href="index.html?menu=1#menu-container">← Voltar ao menu</a>
            <div class="stats">
                <button class="music-button" id="music-button" type="button" aria-pressed="false">Tocar trilha</button>
                <div class="stat">Questão<strong id="progress">1/30</strong></div>
                <div class="stat">Pontos<strong id="score">0</strong></div>
            </div>
        </div>

        <section id="quiz">
            <p class="eyebrow">Geografia mundial</p>
            <h1>De que país é esta bandeira?</h1>
            <div class="flag-wrap">
                <img class="flag" id="flag" alt="Bandeira para adivinhar">
            </div>
            <div class="options" id="options"></div>
            <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
            <button class="next" id="next" type="button">Próxima bandeira</button>
        </section>

        <section class="finish" id="finish">
            <p class="eyebrow">Resultado final</p>
            <h2 id="final-score">0 pontos</h2>
            <p id="final-message"></p>
            <button id="restart" type="button">Jogar novamente</button>
        </section>
    </main>

    <audio id="background-music" src="001.%20Once%20Upon%20a%20Time%20(UNDERTALE%20Soundtrack)%20-%20Toby%20Fox%20-%20Toby%20Fox.mp3" loop preload="none"></audio>
    <p class="music-status" id="music-status" role="status" aria-live="polite"></p>

    <script src="score-counter.js"></script>
    <script>
        const countries = [
            ['Brasil', 'br'], ['Japão', 'jp'], ['França', 'fr'], ['Argentina', 'ar'],
            ['Portugal', 'pt'], ['Canadá', 'ca'], ['Egito', 'eg'], ['Austrália', 'au'],
            ['México', 'mx'], ['Itália', 'it'], ['África do Sul', 'za'], ['Índia', 'in'],
            ['Alemanha', 'de'], ['Chile', 'cl'], ['Reino Unido', 'gb'], ['Estados Unidos', 'us'],
            ['Espanha', 'es'], ['China', 'cn'], ['Coreia do Sul', 'kr'], ['Rússia', 'ru'],
            ['Noruega', 'no'], ['Suécia', 'se'], ['Dinamarca', 'dk'], ['Grécia', 'gr'],
            ['Turquia', 'tr'], ['Ucrânia', 'ua'], ['Suíça', 'ch'], ['Holanda', 'nl'],
            ['Colômbia', 'co'], ['Peru', 'pe'], ['Paraguay', 'py'], ['Uruguai', 'uy'],
            ['Nova Zelândia', 'nz']
        ];

        const quiz = document.getElementById('quiz');
        const finish = document.getElementById('finish');
        const flag = document.getElementById('flag');
        const options = document.getElementById('options');
        const feedback = document.getElementById('feedback');
        const progress = document.getElementById('progress');
        const scoreDisplay = document.getElementById('score');
        const nextButton = document.getElementById('next');
        const backgroundMusic = document.getElementById('background-music');
        const musicButton = document.getElementById('music-button');
        const musicStatus = document.getElementById('music-status');
        let round = 0;
        let score = 0;
        let selectedCountries = [];
        let answered = false;

        musicButton.addEventListener('click', async () => {
            if (!backgroundMusic.paused) {
                backgroundMusic.pause();
                return;
            }

            try {
                await backgroundMusic.play();
                musicButton.textContent = 'Pausar trilha';
                musicButton.setAttribute('aria-pressed', 'true');
                musicStatus.textContent = 'Trilha sonora em reprodução.';
            } catch (error) {
                musicStatus.textContent = 'Não foi possível reproduzir a trilha sonora.';
            }
        });

        backgroundMusic.addEventListener('pause', () => {
            if (backgroundMusic.currentTime > 0) {
                musicButton.textContent = 'Tocar trilha';
                musicButton.setAttribute('aria-pressed', 'false');
                musicStatus.textContent = 'Trilha sonora pausada.';
            }
        });

        function shuffle(items) {
            return [...items].sort(() => Math.random() - 0.5);
        }

        function startGame() {
            round = 0;
            score = 0;
            answered = false;
            selectedCountries = shuffle(countries).slice(0, 30);
            scoreDisplay.textContent = '0';
            quiz.style.display = '';
            finish.classList.remove('visible');
            renderQuestion();
        }

        function renderQuestion() {
            answered = false;
            nextButton.classList.remove('visible');
            feedback.textContent = '';
            const [country, code] = selectedCountries[round];
            progress.textContent = `${round + 1}/${selectedCountries.length}`;
            flag.src = `w2560/${code}.png`;
            flag.alt = 'Bandeira misteriosa';
            options.textContent = '';

            const choices = shuffle([
                country,
                ...shuffle(countries.filter(([name]) => name !== country))
                    .slice(0, 3)
                    .map(([name]) => name)
            ]);

            choices.forEach((choice) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'option';
                button.dataset.country = choice;
                button.dataset.countryCode = countries.find(([name]) => name === choice)[1];
                button.addEventListener('click', () => answer(button, choice, country));
                options.appendChild(button);
            });
            localizeCountryOptions();
        }

        function localizeCountryOptions() {
            Array.from(options.children).forEach((button) => {
                const country = button.dataset.country;
                const localizedCountry = window.BuuroGameLanguage.regionName(button.dataset.countryCode, country);
                button.textContent = localizedCountry;
            });
        }

        function answer(button, choice, country) {
            if (answered) return;
            answered = true;
            const correct = choice === country;
            const localizedCountry = button.textContent;

            Array.from(options.children).forEach((option) => {
                option.disabled = true;
                if (option.dataset.country === country) option.classList.add('correct');
            });

            if (correct) {
                button.classList.add('correct');
                score += 100;
                scoreDisplay.textContent = score;
                feedback.textContent = 'Resposta correta! Você ganhou 100 pontos.';
            } else {
                button.classList.add('wrong');
                feedback.textContent = `Resposta errada. Esta bandeira é de ${localizedCountry}. Voltando à primeira questão...`;
                nextButton.textContent = 'Voltar à primeira questão';
                nextButton.dataset.restartOnClick = 'true';
            }

            if (correct) {
                nextButton.dataset.restartOnClick = 'false';
                nextButton.textContent = round === selectedCountries.length - 1 ? 'Ver resultado' : 'Próxima bandeira';
            }
            nextButton.classList.add('visible');
        }

        nextButton.addEventListener('click', () => {
            if (nextButton.dataset.restartOnClick === 'true') {
                startGame();
                return;
            }
            if (round < selectedCountries.length - 1) {
                round += 1;
                renderQuestion();
            } else {
                finishGame();
            }
        });

        function finishGame() {
            quiz.style.display = 'none';
            finish.classList.add('visible');
            document.getElementById('final-score').textContent = `${score} pontos`;
            const correctAnswers = score / 100;
            document.getElementById('final-message').textContent =
                `Você acertou ${correctAnswers} de ${selectedCountries.length} bandeiras.`;

            if (window.GameScoreCounter && score > 0) {
                window.GameScoreCounter.add('bandeiras', score);
            }
        }

        window.addEventListener('buuro-language-applied', localizeCountryOptions);
        document.getElementById('restart').addEventListener('click', startGame);
        startGame();
    </script>
</body>
</html>
