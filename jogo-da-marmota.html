<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jogo da Marmota | Buuro</title>
    <script src="game-language.js" defer></script>
    <style>
        :root {
            color-scheme: dark;
            --background: #10210c;
            --panel: #1d3516;
            --green: #83d64a;
            --green-dark: #4a7c2c;
            --orange: #e67e22;
            --text: #f7fff0;
            --muted: #c3d6b7;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at top, #7ec850, #28531b 68%, var(--background));
            color: var(--text);
            font-family: "Segoe UI", Tahoma, sans-serif;
        }

        .game {
            width: min(100%, 620px);
            padding: clamp(20px, 5vw, 36px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 26px;
            background: rgba(25,57,18,0.9);
            box-shadow: 0 24px 70px rgba(0,0,0,0.35);
            text-align: center;
        }

        h1 {
            margin: 0 0 8px;
            color: #fff;
            font-size: clamp(2rem, 8vw, 3rem);
            text-shadow: 2px 3px 8px rgba(0,0,0,0.3);
        }

        .intro {
            margin: 0 auto 20px;
            color: var(--muted);
            line-height: 1.5;
        }

        .hud {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat {
            min-width: 130px;
            padding: 10px 16px;
            border: 1px solid rgba(255,255,255,0.13);
            border-radius: 14px;
            background: var(--green-dark);
            color: #fff;
            font-weight: 700;
        }

        .stat strong {
            display: block;
            margin-top: 3px;
            font-size: 1.3rem;
            font-variant-numeric: tabular-nums;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: clamp(10px, 3vw, 18px);
            width: min(100%, 450px);
            margin: 0 auto;
        }

        .hole {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            overflow: hidden;
            border: 6px solid #5d4037;
            border-radius: 50%;
            background: #4e342e;
            box-shadow: inset 0 12px 15px rgba(0,0,0,0.6);
            cursor: pointer;
            touch-action: manipulation;
        }

        .hole:disabled { cursor: default; }

        .hole:focus-visible,
        button:focus-visible,
        a:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 4px;
        }

        .mole {
            position: absolute;
            bottom: 0;
            left: 12.5%;
            display: flex;
            width: 75%;
            height: 85%;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 17%;
            border: 3px solid #5d4037;
            border-radius: 50% 50% 15% 15%;
            background: #a98270;
            transform: translateY(110%);
            transition: transform 150ms ease-out, background-color 100ms ease;
            pointer-events: none;
        }

        .hole.up .mole { transform: translateY(0); }
        .hole.hit .mole { background: #e53935; }

        .eyes {
            display: flex;
            gap: 12px;
            margin-bottom: 7px;
        }

        .eye {
            width: clamp(6px, 2vw, 10px);
            height: clamp(6px, 2vw, 10px);
            border-radius: 50%;
            background: #111;
        }

        .nose {
            width: 20px;
            height: 13px;
            border-radius: 50%;
            background: #ff8a80;
        }

        .status {
            min-height: 48px;
            margin: 16px 0 12px;
            color: var(--text);
            line-height: 1.5;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .music-status {
            min-height: 20px;
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .music-button {
            background: #334155;
            box-shadow: none;
        }

        button,
        .menu-link {
            min-height: 46px;
            padding: 11px 22px;
            border: 0;
            border-radius: 11px;
            background: var(--orange);
            box-shadow: 0 4px 0 #b95d0d;
            color: #fff;
            font: inherit;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            transition: filter 150ms ease, transform 100ms ease;
        }

        button:hover,
        .menu-link:hover { filter: brightness(1.08); }

        button:active,
        .menu-link:active {
            transform: translateY(3px);
            box-shadow: none;
        }

        button:disabled {
            background: #718078;
            box-shadow: none;
            cursor: not-allowed;
        }

        .menu-link {
            display: inline-flex;
            align-items: center;
            margin-top: 20px;
            background: #334155;
            box-shadow: none;
        }

        @media (max-width: 420px) {
            body { padding: 10px; }
            .game { padding: 20px 14px; }
            .stat { min-width: 0; flex: 1; padding-inline: 8px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition-duration: 0.01ms !important; }
        }
    </style>
    <link rel="stylesheet" href="site-preferences.css">
    <script src="site-preferences.js"></script>
</head>
<body>
    <main class="game">
        <h1>Jogo da Marmota</h1>
        <p class="intro" data-explanatory-text>A marmota vai aparecer em diferentes buracos. Acerte nela antes que se esconda!</p>

        <div class="hud" aria-label="Placar da partida">
            <div class="stat">Pontos<strong id="score">0</strong></div>
            <div class="stat">Tempo<strong><span id="time">30</span>s</strong></div>
        </div>

        <div class="grid" id="game-grid" aria-label="Nove buracos">
            <button class="hole" type="button" aria-label="Buraco 1, vazio" disabled><span class="mole" aria-hidden="true"><span class="eyes"><span class="eye"></span><span class="eye"></span></span><span class="nose"></span></span></button>
            <button class="hole" type="button" aria-label="Buraco 2, vazio" disabled><span class="mole" aria-hidden="true"><span class="eyes"><span class="eye"></span><span class="eye"></span></span><span class="nose"></span></span></button>
            <button class="hole" type="button" aria-label="Buraco 3, vazio" disabled><span class="mole" aria-hidden="true"><span class="eyes"><span class="eye"></span><span class="eye"></span></span><span class="nose"></span></span></button>
            <button class="hole" type="button" aria-label="Buraco 4, vazio" disabled><span class="mole" aria-hidden="true"><span class="eyes"><span class="eye"></span><span class="eye"></span></span><span class="nose"></span></span></button>
            <button class="hole" type="button" aria-label="Buraco 5, vazio" disabled><span class="mole" aria-hidden="true"><span class="eyes"><span class="eye"></span><span class="eye"></span></span><span class="nose"></span></span></button>
            <button class="hole" type="button" aria-label="Buraco 6, vazio" disabled><span class="mole" aria-hidden="true"><span class="eyes"><span class="eye"></span><span class="eye"></span></span><span class="nose"></span></span></button>
            <button class="hole" type="button" aria-label="Buraco 7, vazio" disabled><span class="mole" aria-hidden="true"><span class="eyes"><span class="eye"></span><span class="eye"></span></span><span class="nose"></span></span></button>
            <button class="hole" type="button" aria-label="Buraco 8, vazio" disabled><span class="mole" aria-hidden="true"><span class="eyes"><span class="eye"></span><span class="eye"></span></span><span class="nose"></span></span></button>
            <button class="hole" type="button" aria-label="Buraco 9, vazio" disabled><span class="mole" aria-hidden="true"><span class="eyes"><span class="eye"></span><span class="eye"></span></span><span class="nose"></span></span></button>
        </div>

        <p class="status" id="game-status" role="status" aria-live="polite">Aperte “Iniciar jogo” para começar.</p>
        <div class="controls">
            <button type="button" id="start-button">Iniciar jogo</button>
            <button type="button" id="music-button" class="music-button" aria-pressed="false">Tocar trilha sonora</button>
        </div>
        <p class="music-status" id="music-status" role="status" aria-live="polite"></p>
        <a class="menu-link" href="index.html?menu=1#menu-container">Voltar ao menu</a>
    </main>
    <audio id="background-music" src="Main%20Theme%20%20Pirates%20of%20the%20Caribbean%20-%20Suite%20Movie%20Themes.mp3" loop preload="none"></audio>

    <script src="score-counter.js"></script>
    <script>
        const holes = Array.from(document.querySelectorAll('.hole'));
        const scoreDisplay = document.getElementById('score');
        const timeDisplay = document.getElementById('time');
        const statusDisplay = document.getElementById('game-status');
        const startButton = document.getElementById('start-button');
        const backgroundMusic = document.getElementById('background-music');
        const musicButton = document.getElementById('music-button');
        const musicStatus = document.getElementById('music-status');
        let score = 0;
        let timeLeft = 30;
        let running = false;
        let activeHoleIndex = -1;
        let lastHoleIndex = -1;
        let countdownTimer = null;
        let moleTimer = null;
        let hideMoleTimer = null;

        musicButton.addEventListener('click', async () => {
            if (!backgroundMusic.paused) {
                backgroundMusic.pause();
                return;
            }

            try {
                await backgroundMusic.play();
                musicButton.textContent = 'Pausar trilha sonora';
                musicButton.setAttribute('aria-pressed', 'true');
                musicStatus.textContent = 'Trilha sonora em reprodução.';
            } catch (error) {
                console.error('Não foi possível reproduzir a trilha sonora da Marmota.', error);
                musicStatus.textContent = 'Não foi possível reproduzir a trilha sonora.';
            }
        });

        backgroundMusic.addEventListener('pause', () => {
            if (backgroundMusic.currentTime > 0) {
                musicButton.textContent = 'Tocar trilha sonora';
                musicButton.setAttribute('aria-pressed', 'false');
                musicStatus.textContent = 'Trilha sonora pausada.';
            }
        });

        function hideMole() {
            if (activeHoleIndex >= 0) {
                holes[activeHoleIndex].classList.remove('up');
                holes[activeHoleIndex].setAttribute('aria-label', `Buraco ${activeHoleIndex + 1}, vazio`);
            }
            activeHoleIndex = -1;
        }

        function showMole() {
            if (!running) return;
            hideMole();
            if (hideMoleTimer !== null) clearTimeout(hideMoleTimer);

            let nextIndex = Math.floor(Math.random() * holes.length);
            while (holes.length > 1 && nextIndex === lastHoleIndex) {
                nextIndex = Math.floor(Math.random() * holes.length);
            }
            lastHoleIndex = nextIndex;
            activeHoleIndex = nextIndex;
            holes[nextIndex].classList.add('up');
            holes[nextIndex].setAttribute('aria-label', `Buraco ${nextIndex + 1}, marmota!`);
            hideMoleTimer = setTimeout(hideMole, 1100);
        }

        function finishGame() {
            running = false;
            clearInterval(countdownTimer);
            clearInterval(moleTimer);
            clearTimeout(hideMoleTimer);
            countdownTimer = null;
            moleTimer = null;
            hideMoleTimer = null;
            hideMole();
            holes.forEach((hole) => { hole.disabled = true; });
            startButton.disabled = false;
            startButton.textContent = 'Jogar novamente';
            statusDisplay.textContent = `Fim de jogo! Você fez ${score} pontos.`;
            if (window.GameScoreCounter && score > 0) {
                window.GameScoreCounter.add('marmota', score);
            }
        }

        function startGame() {
            if (running) return;
            clearInterval(countdownTimer);
            clearInterval(moleTimer);
            clearTimeout(hideMoleTimer);
            score = 0;
            timeLeft = 30;
            lastHoleIndex = -1;
            scoreDisplay.textContent = String(score);
            timeDisplay.textContent = String(timeLeft);
            statusDisplay.textContent = 'Acerte as marmotas! Cada acerto vale 10 pontos.';
            startButton.disabled = true;
            holes.forEach((hole) => { hole.disabled = false; });
            running = true;
            showMole();
            moleTimer = setInterval(showMole, 1200);
            countdownTimer = setInterval(() => {
                timeLeft--;
                timeDisplay.textContent = String(timeLeft);
                if (timeLeft <= 0) finishGame();
            }, 1000);
        }

        holes.forEach((hole, index) => {
            hole.addEventListener('click', () => {
                if (!running || index !== activeHoleIndex) return;
                score += 10;
                scoreDisplay.textContent = String(score);
                hole.classList.add('hit');
                hideMole();
                if (hideMoleTimer !== null) clearTimeout(hideMoleTimer);
                hideMoleTimer = null;
                statusDisplay.textContent = 'Acertou! +10 pontos.';
                setTimeout(() => hole.classList.remove('hit'), 180);
            });
        });

        startButton.addEventListener('click', startGame);
    </script>
</body>
</html>
