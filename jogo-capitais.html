<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capitais dos Países</title>
    <script src="game-language.js"></script>
    <style>
        :root {
            --ink: #172033;
            --paper: #f7f1df;
            --gold: #f5c542;
            --orange: #e87932;
            --green: #287a67;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Georgia, "Times New Roman", serif;
            color: var(--ink);
            background: #000;
        }

        .game {
            width: min(680px, 100%);
            min-height: 560px;
            border: 2px solid rgba(245,197,66,0.72);
            border-radius: 8px;
            background: linear-gradient(145deg, rgba(40,122,103,0.96), rgba(18,54,70,0.97) 58%, rgba(232,121,50,0.88));
            box-shadow: 0 24px 70px rgba(245,197,66,0.12);
            padding: clamp(24px, 5vw, 42px);
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 28px;
        }

        .topbar a {
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 0.86rem;
            font-weight: 800;
            text-decoration: none;
        }

        .stats {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .music-button {
            min-height: 38px;
            border: 1px solid rgba(255,224,122,0.42);
            border-radius: 6px;
            background: rgba(255,224,122,0.16);
            color: #fff;
            padding: 0 10px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 0.78rem;
            font-weight: 800;
        }

        .music-status {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
        }

        .stat {
            min-width: 82px;
            border: 1px solid rgba(245,197,66,0.32);
            border-radius: 6px;
            padding: 8px 10px;
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 0.78rem;
            color: rgba(255,255,255,0.78);
        }

        .stat strong {
            display: block;
            margin-top: 2px;
            color: #fff;
            font-size: 1.05rem;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: #ffe07a;
            font-family: Arial, sans-serif;
            font-size: 0.78rem;
            font-weight: 900;
            text-transform: uppercase;
        }

        h1 {
            max-width: 560px;
            color: #fff;
            margin: 0 0 28px;
            font-size: clamp(1.8rem, 5vw, 3.1rem);
            line-height: 1.08;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .option {
            min-height: 64px;
            border: 1px solid rgba(255,224,122,0.42);
            border-radius: 6px;
            background: rgba(255,255,255,0.12);
            color: #fff;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 1rem;
            font-weight: 800;
            transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
        }

        .option:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: #ffe07a;
            background: rgba(245,197,66,0.22);
        }

        .option.correct {
            border-color: #ffe07a;
            background: rgba(245,197,66,0.32);
        }

        .option.wrong {
            border-color: #ff9179;
            background: rgba(184,75,67,0.38);
        }

        .option:disabled { cursor: default; }

        .feedback {
            min-height: 48px;
            margin: 18px 0 10px;
            color: rgba(255,255,255,0.82);
            font-family: Arial, sans-serif;
            line-height: 1.45;
        }

        .next {
            display: none;
            width: 100%;
            min-height: 48px;
            border: 0;
            border-radius: 6px;
            background: linear-gradient(90deg, #1f765d, #e87932);
            color: #fff;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-weight: 900;
        }

        .next.visible { display: block; }

        .finish {
            display: none;
            text-align: center;
        }

        .finish.visible { display: block; }

        .finish h2 {
            margin: 18px 0 8px;
            font-size: clamp(2.2rem, 7vw, 4.2rem);
        }

        .finish p { font-family: Arial, sans-serif; color: rgba(255,255,255,0.82); }

        .finish button {
            margin-top: 16px;
            min-height: 48px;
            border: 0;
            border-radius: 6px;
            padding: 0 24px;
            background: linear-gradient(90deg, #f5c542, #e87932);
            color: #fff;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-weight: 900;
        }

        @media (max-width: 560px) {
            body { padding: 12px; }
            .game { min-height: calc(100vh - 24px); padding: 20px 16px; }
            .topbar { align-items: flex-start; }
            .stats { flex-direction: column; align-items: flex-end; }
            .stat { min-width: 74px; }
            .options { grid-template-columns: 1fr; }
            .option { min-height: 56px; }
        }
    </style>
    <link rel="stylesheet" href="site-preferences.css">
    <script src="site-preferences.js"></script>
</head>
<body>
    <main class="game">
        <div class="topbar">
            <a href="index.html?menu=1#menu-container">← Voltar ao menu</a>
            <div class="stats">
                <button class="music-button" id="music-button" type="button" aria-pressed="false">Tocar trilha</button>
                <div class="stat">Questão<strong id="progress">1/30</strong></div>
                <div class="stat">Pontos<strong id="score">0</strong></div>
            </div>
        </div>

        <section id="quiz">
            <p class="eyebrow">Geografia mundial</p>
            <h1 id="question">Qual é a capital?</h1>
            <div class="options" id="options"></div>
            <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
            <button class="next" id="next" type="button">Próxima pergunta</button>
        </section>

        <section class="finish" id="finish">
            <p class="eyebrow">Resultado final</p>
            <h2 id="final-score">0 pontos</h2>
            <p id="final-message"></p>
            <button id="restart" type="button">Jogar novamente</button>
        </section>
    </main>

        function localizeCity(city) {
            const language = window.BuuroGameLanguage.language;
            return (cityTranslations[language] && cityTranslations[language][city]) || city;
        }

        const quiz = document.getElementById('quiz');
        const finish = document.getElementById('finish');
        const question = document.getElementById('question');
        const options = document.getElementById('options');
        const feedback = document.getElementById('feedback');
        const progress = document.getElementById('progress');
        const scoreDisplay = document.getElementById('score');
        const nextButton = document.getElementById('next');
        const restartButton = document.getElementById('restart');
        const backgroundMusic = document.getElementById('background-music');
        const musicButton = document.getElementById('music-button');
        const musicStatus = document.getElementById('music-status');
        let round = 0;
        let score = 0;
        let selectedQuestions = [];
        let answered = false;
        let lastAnswerChoice = null;

        musicButton.addEventListener('click', async () => {
            if (!backgroundMusic.paused) {
                backgroundMusic.pause();
                return;
            }

            try {
                await backgroundMusic.play();
                musicButton.textContent = 'Pausar trilha';
                musicButton.setAttribute('aria-pressed', 'true');
                musicStatus.textContent = 'Trilha sonora em reprodução.';
            } catch (error) {
                musicStatus.textContent = 'Não foi possível reproduzir a trilha sonora.';
            }
        });

        backgroundMusic.addEventListener('pause', () => {
            if (backgroundMusic.currentTime > 0) {
                musicButton.textContent = 'Tocar trilha';
                musicButton.setAttribute('aria-pressed', 'false');
                musicStatus.textContent = 'Trilha sonora pausada.';
            }
        });

        function shuffle(items) {
            return [...items].sort(() => Math.random() - 0.5);
        }

        function startGame() {
            round = 0;
            score = 0;
            answered = false;
            lastAnswerChoice = null;
            selectedQuestions = shuffle(questions).slice(0, 30);
            scoreDisplay.textContent = '0';
            quiz.style.display = '';
            finish.classList.remove('visible');
            renderQuestion();
        }

        function renderQuestion() {
            answered = false;
            nextButton.classList.remove('visible');
            feedback.textContent = '';
            const [country, capital, choices, countryCode] = selectedQuestions[round];
            progress.textContent = `${round + 1}/${selectedQuestions.length}`;
            question.dataset.country = country;
            question.dataset.countryCode = countryCode;
            localizeCapitalQuestion();
            options.textContent = '';

            shuffle(choices).forEach((choice) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'option';
                button.textContent = localizeCity(choice);
                button.dataset.answer = choice;
                button.addEventListener('click', () => answer(button, choice, capital));
                options.appendChild(button);
            });
        }

        function localizeCapitalQuestion() {
            const language = window.BuuroGameLanguage.language;
            const localizedCountry = window.BuuroGameLanguage.regionName(
                question.dataset.countryCode,
                question.dataset.country
            );
            const countryCode = question.dataset.countryCode;
            if (language === 'fr') {
                question.textContent = `Quelle est la capitale ${frenchCountryArticles[countryCode]}${localizedCountry} ?`;
            } else if (language === 'pt-BR') {
                question.textContent = `Qual é a capital ${portugueseCountryArticles[countryCode]}${localizedCountry}?`;
            } else if (language === 'it') {
                question.textContent = `Qual è la capitale ${italianCountryArticles[countryCode]}${localizedCountry}?`;
            } else if (language === 'ru') {
                question.textContent = `Какова столица ${russianCountryGenitives[countryCode]}?`;
            } else if (language === 'en') {
                question.textContent = `What is the capital of ${englishCountryArticles[countryCode] || ''}${localizedCountry}?`;
            } else if (language === 'es') {
                question.textContent = `¿Cuál es la capital de ${spanishCountryArticles[countryCode] || ''}${localizedCountry}?`;
            } else {
                question.textContent = window.BuuroGameLanguage.capitalQuestion(localizedCountry);
            }
            Array.from(options.children).forEach((option) => {
                option.textContent = localizeCity(option.dataset.answer);
            });

            if (answered && lastAnswerChoice !== null) {
                const messages = questionMessages[language];
                feedback.textContent = lastAnswerChoice === selectedQuestions[round][1]
                    ? messages.correct
                    : messages.wrong.replace('{capital}', localizeCity(selectedQuestions[round][1]));
            }
        }

        function answer(button, choice, capital) {
            if (answered) return;
            answered = true;
            lastAnswerChoice = choice;
            const correct = choice === capital;

            Array.from(options.children).forEach((option) => {
                option.disabled = true;
                if (option.dataset.answer === capital) option.classList.add('correct');
            });

            if (correct) {
                button.classList.add('correct');
                score += 100;
                scoreDisplay.textContent = score;
                feedback.textContent = questionMessages[window.BuuroGameLanguage.language].correct;
            } else {
                button.classList.add('wrong');
                feedback.textContent = questionMessages[window.BuuroGameLanguage.language].wrong
                    .replace('{capital}', localizeCity(capital));
            }

            nextButton.textContent = round === selectedQuestions.length - 1 ? 'Ver resultado' : 'Próxima pergunta';
            nextButton.classList.add('visible');
        }

        window.addEventListener('buuro-language-applied', localizeCapitalQuestion);
        nextButton.addEventListener('click', () => {
            if (round < selectedQuestions.length - 1) {
                round += 1;
                renderQuestion();
            } else {
                finishGame();
            }
        });

        function finishGame() {
            quiz.style.display = 'none';
            finish.classList.add('visible');
            document.getElementById('final-score').textContent = `${score} pontos`;
            const correctAnswers = score / 100;
            document.getElementById('final-message').textContent =
                `Você acertou ${correctAnswers} de ${selectedQuestions.length} perguntas.`;

            if (window.GameScoreCounter && score > 0) {
                window.GameScoreCounter.add('capitais', score);
            }
        }

        restartButton.addEventListener('click', startGame);
        startGame();
