<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=./index.html">
    <title>Mega Jogo da Memória Gourmet</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #111827;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }

        h1 {
            margin-bottom: 5px;
            color: #f59e0b;
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
            font-size: 1.8rem;
            text-align: center;
        }

        /* Seletor de Dificuldade */
        .difficulty-panel {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .difficulty-panel label {
            font-weight: bold;
            color: #9ca3af;
        }

        select {
            background: #1f2937;
            color: #fff;
            border: 1px solid #374151;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            outline: none;
        }

        select:focus {
            border-color: #f59e0b;
        }

        /* Painel de Status */
        .status-panel {
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
            font-size: 1.1rem;
            background: #1f2937;
            padding: 8px 25px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border: 1px solid #374151;
        }

        .status-item span {
            font-weight: bold;
            color: #f59e0b;
        }

        /* Tabuleiro dinâmico controlado por classes JS */
        .grid {
            display: grid;
            grid-gap: 6px;
            perspective: 1000px;
        }

        /* Classes para ajustar as colunas dependendo da dificuldade */
        .grid.easy { grid-template-columns: repeat(4, 55px); }
        .grid.medium { grid-template-columns: repeat(6, 42px); }
        .grid.hard { grid-template-columns: repeat(8, 38px); }

        @media (min-width: 480px) {
            .grid.easy { grid-template-columns: repeat(4, 75px); grid-gap: 10px; }
            .grid.medium { grid-template-columns: repeat(6, 60px); grid-gap: 8px; }
            .grid.hard { grid-template-columns: repeat(8, 52px); grid-gap: 6px; }
        }

        @media (min-width: 768px) {
            .grid.easy { grid-template-columns: repeat(4, 110px); grid-gap: 15px; }
            .grid.medium { grid-template-columns: repeat(6, 95px); grid-gap: 12px; }
            .grid.hard { grid-template-columns: repeat(8, 85px); grid-gap: 10px; }
        }

        /* Estrutura das cartas */
        .card {
            width: 100%;
            aspect-ratio: 1 / 1;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .card.flip {
            transform: rotateY(180deg);
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        @media (min-width: 480px) {
            .face { font-size: 1.8rem; }
        }

        @media (min-width: 768px) {
            .face { font-size: 2.3rem; border-radius: 12px; }
        }

        /* Verso revelado */
        .front-face {
            background-color: #374151;
            transform: rotateY(180deg);
            border: 2px solid #f59e0b;
        }

        /* Frente oculta */
        .back-face {
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            border: 2px solid #374151;
            transition: border-color 0.2s;
        }

        .card:hover .back-face {
            border-color: #f59e0b;
        }

        /* Botão */
        button {
            margin-top: 25px;
            padding: 10px 25px;
            font-size: 0.95rem;
            font-weight: bold;
            text-transform: uppercase;
            background-color: #f59e0b;
            color: #111827;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
            transition: transform 0.2s, background-color 0.2s;
        }

        button:hover {
            background-color: #fbbf24;
            transform: translateY(-2px);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }
    </style>
</head>
<body>

    <h1>Jogo da Memória Gourmet</h1>
    
    <!-- Novo Seletor de Dificuldade -->
    <div class="difficulty-panel">
        <label for="difficulty">Dificuldade:</label>
        <select id="difficulty" onchange="resetGame()">
            <option value="easy">Fácil (4x4)</option>
            <option value="medium" selected>Médio (6x6)</option>
            <option value="hard">Difícil (8x8)</option>
        </select>
    </div>
    
    <div class="status-panel">
        <div class="status-item">Tempo: <span id="timer">00:00</span></div>
        <div class="status-item">Erros: <span id="wrong-attempts">0</span></div>
    </div>
    
    <div class="grid" id="grid"></div>

    <div class="controls">
        <button id="music-toggle" type="button" aria-pressed="false">Tocar música</button>
        <button type="button" onclick="resetGame()">Reiniciar Jogo</button>
    </div>
    <audio id="background-music" src="./One%20Piece%20ST%20-%20New%20World%20Symphony%20-%20XImmortalX.mp3" loop preload="none"></audio>

    <script>
        const grid = document.getElementById('grid');
        const timerDisplay = document.getElementById('timer');
        const attemptsDisplay = document.getElementById('wrong-attempts');
        const difficultySelect = document.getElementById('difficulty');
        const music = document.getElementById('background-music');
        const musicToggle = document.getElementById('music-toggle');
        
        // Banco de emojis de alimentos usados nos níveis.
        const allFoods = [
            '🍕', '🍔', '🍿', '🍩', '🍦', '🍫', '🍓', '🥑', 
            '🍉', '🍇', '🍌', '🍍', '🍎', '🥦', '🥕', '🌽', 
            '🥩', '🥞', '🍳', '🧀', '🥨', '🥐', '🌮', '🍣',
            '🍒', '🍑', '🥝', '🍐', '🍊', '🫐', '🥥', '🥭',
            '🍟', '🌭', '🥪', '🌯', '🥗', '🍜', '🍙', '🧁',
            '🍪', '🎂', '🥧', '🍞', '🥯', '🫒', '🧄', '🧅'
        ];

        let cardsArray = [];
        let firstCard = null;
        let secondCard = null;
        let lockBoard = false;
        
        let wrongAttempts = 0;
        let totalMatches = 0;
        let timeElapsed = 0;
        let timerInterval = null;
        let mismatchTimeout = null;
        let victoryTimeout = null;
        let gameStarted = false;

        function shuffle(array) {
            for (let index = array.length - 1; index > 0; index--) {
                const randomIndex = Math.floor(Math.random() * (index + 1));
                [array[index], array[randomIndex]] = [array[randomIndex], array[index]];
            }
            return array;
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timeElapsed = 0;
            timerInterval = setInterval(() => {
                timeElapsed++;
                const minutes = String(Math.floor(timeElapsed / 60)).padStart(2, '0');
                const seconds = String(timeElapsed % 60).padStart(2, '0');
                timerDisplay.textContent = `${minutes}:${seconds}`;
            }, 1000);
        }

        // Configura o tamanho do jogo baseado na dificuldade escolhida
        function updateDifficulty() {
            const difficulty = difficultySelect.value;
            let pairsCount = 18; // Padrão médio

            // Limpa classes antigas de tamanho da grid
            grid.className = 'grid';

            if (difficulty === 'easy') {
                pairsCount = 8;
                grid.classList.add('easy');
            } else if (difficulty === 'medium') {
                pairsCount = 18;
                grid.classList.add('medium');
            } else if (difficulty === 'hard') {
                pairsCount = 32;
                grid.classList.add('hard');
            }

            // Recorta a quantidade necessária de emojis do banco e duplica
            const selectedFoods = allFoods.slice(0, pairsCount);
            cardsArray = [...selectedFoods, ...selectedFoods];
        }

        function createBoard() {
            grid.innerHTML = '';
            updateDifficulty();
            const shuffledCards = shuffle([...cardsArray]);

            shuffledCards.forEach((symbol) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.symbol = symbol;

                const frontFace = document.createElement('div');
                frontFace.classList.add('face', 'front-face');
                frontFace.textContent = symbol;

                const backFace = document.createElement('div');
                backFace.classList.add('face', 'back-face');
                backFace.textContent = '🍱';

                card.appendChild(frontFace);
                card.appendChild(backFace);
                card.addEventListener('click', flipCard);
                grid.appendChild(card);
            });
        }

        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;

            if (!gameStarted) {
                gameStarted = true;
                startTimer();
            }

            this.classList.add('flip');

            if (!firstCard) {
                firstCard = this;
                return;
            }

            secondCard = this;
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.symbol === secondCard.dataset.symbol;
            if (isMatch) {
                disableCards();
            } else {
                unflipCards();
            }
        }

        function disableCards() {
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);
            
            totalMatches++;
            if (totalMatches === cardsArray.length / 2) {
                clearInterval(timerInterval);
                timerInterval = null;
                const difficultyName = difficultySelect.options[difficultySelect.selectedIndex].text;
                victoryTimeout = setTimeout(() => {
                    alert(`Sensacional! Você completou o nível no modo ${difficultyName}!\nTempo: ${timerDisplay.textContent}\nErros: ${wrongAttempts}`);
                    victoryTimeout = null;
                }, 500);
            }
            resetBoard();
        }

        function unflipCards() {
            lockBoard = true;
            wrongAttempts++;
            attemptsDisplay.textContent = wrongAttempts;
            mismatchTimeout = setTimeout(() => {
                firstCard.classList.remove('flip');
                secondCard.classList.remove('flip');
                mismatchTimeout = null;
                resetBoard();
            }, 1000);
        }

        function resetBoard() {
            [firstCard, secondCard] = [null, null];
            lockBoard = false;
        }

        function resetGame() {
            clearInterval(timerInterval);
            clearTimeout(mismatchTimeout);
            clearTimeout(victoryTimeout);
            timerInterval = null;
            mismatchTimeout = null;
            victoryTimeout = null;
            gameStarted = false;
            wrongAttempts = 0;
            totalMatches = 0;
            timerDisplay.textContent = '00:00';
            attemptsDisplay.textContent = '0';
            resetBoard();
            createBoard();
        }

        musicToggle.addEventListener('click', async () => {
            if (music.paused) {
                try {
                    await music.play();
                    musicToggle.textContent = 'Pausar música';
                    musicToggle.setAttribute('aria-pressed', 'true');
                } catch {
                    musicToggle.textContent = 'Áudio indisponível';
                }
                return;
            }

            music.pause();
            musicToggle.textContent = 'Tocar música';
            musicToggle.setAttribute('aria-pressed', 'false');
        });

        music.addEventListener('ended', () => {
            musicToggle.textContent = 'Tocar música';
            musicToggle.setAttribute('aria-pressed', 'false');
        });

        // Inicia o jogo no modo Médio na primeira carga.
        createBoard();
