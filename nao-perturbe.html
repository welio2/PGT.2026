<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Não Perturbe | Buuro</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --card-bg: #fff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --accent: #6366f1;
            --border: #e5e7eb;
            --success: #10b981;
            --danger: #ef4444;
        }

        body.dnd-active {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #818cf8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-color);
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: min(100%, 460px);
            padding: 24px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--card-bg);
            box-shadow: 0 16px 42px rgba(0,0,0,0.12);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.3rem;
        }

        .title-group p {
            margin-top: 4px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .switch {
            position: relative;
            display: inline-block;
            flex: 0 0 52px;
            width: 52px;
            height: 28px;
        }

        .switch input {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
        }

        .slider {
            position: absolute;
            inset: 0;
            border-radius: 34px;
            background: #cbd5e1;
            cursor: pointer;
            transition: background-color 0.25s;
        }

        .slider::before {
            position: absolute;
            left: 4px;
            bottom: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fff;
            content: "";
            transition: transform 0.25s;
        }

        .switch input:checked + .slider { background: var(--accent); }
        .switch input:checked + .slider::before { transform: translateX(24px); }
        .switch input:focus-visible + .slider { outline: 3px solid var(--text-main); outline-offset: 3px; }

        .section { margin-top: 22px; }

        .section h2 {
            margin-bottom: 13px;
            color: var(--text-muted);
            font-size: 0.88rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .option-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        .option-row input {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
        }

        .test-buttons {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 9px;
        }

        button,
        .back-link {
            min-height: 42px;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: transparent;
            color: var(--text-main);
            font-size: 0.88rem;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        button:hover,
        .back-link:hover {
            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
        }

        button:focus-visible,
        .back-link:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 3px;
        }

        .log-box {
            min-height: 150px;
            max-height: 220px;
            margin-top: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            border-radius: 9px;
            background: var(--bg-color);
            font-size: 0.85rem;
        }

        .empty-log {
            margin: auto;
            color: var(--text-muted);
            text-align: center;
        }

        .log-item {
            padding: 9px;
            border-left: 4px solid var(--text-muted);
            border-radius: 6px;
            background: var(--card-bg);
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .log-item.allowed { border-left-color: var(--success); }
        .log-item.blocked { border-left-color: var(--danger); opacity: 0.78; }

        .back-link {
            display: block;
            margin-top: 18px;
            background: var(--card-bg);
        }

        @media (max-width: 380px) {
            .container { padding: 18px; }
            .test-buttons { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main class="container">
        <header class="header">
            <div class="title-group">
                <h1><span id="status-icon" aria-hidden="true">☀️</span> Não Perturbe</h1>
                <p id="status-text" aria-live="polite">Notificações ativadas</p>
            </div>
            <label class="switch">
                <input type="checkbox" id="dnd-toggle" aria-label="Ativar modo Não Perturbe" aria-describedby="status-text">
                <span class="slider" aria-hidden="true"></span>
            </label>
        </header>

        <section class="section" aria-labelledby="exceptions-title">
            <h2 id="exceptions-title">Exceções permitidas</h2>
            <div class="option-row">
                <label for="allow-vip">Permitir contatos VIP (Mãe, Chefe)</label>
                <input type="checkbox" id="allow-vip" checked>
            </div>
            <div class="option-row">
                <label for="allow-urgent">Permitir alertas urgentes</label>
                <input type="checkbox" id="allow-urgent" checked>
            </div>
        </section>

        <section class="section" aria-labelledby="simulate-title">
            <h2 id="simulate-title">Simular notificação recebida</h2>
            <div class="test-buttons">
                <button type="button" data-sender="Instagram" data-message="Curtiu sua foto">📱 App comum</button>
                <button type="button" data-sender="Mãe" data-message="Me liga quando puder" data-vip="true">⭐ Contato VIP</button>
                <button type="button" data-sender="Banco" data-message="Alerta de segurança" data-urgent="true">🚨 Urgente</button>
                <button type="button" id="clear-log">🗑️ Limpar histórico</button>
            </div>
            <div class="log-box" id="log-box" role="log" aria-live="polite" aria-relevant="additions">
                <p class="empty-log">Clique nos botões acima para testar.</p>
            </div>
        </section>

        <a class="back-link" href="index.html?menu=1#menu-container">Voltar ao menu do jogo</a>
    </main>

    <script>
        const dndToggle = document.getElementById('dnd-toggle');
        const statusIcon = document.getElementById('status-icon');
        const statusText = document.getElementById('status-text');
        const allowVipCheckbox = document.getElementById('allow-vip');
        const allowUrgentCheckbox = document.getElementById('allow-urgent');
        const logBox = document.getElementById('log-box');
        let hasLogEntries = false;

        dndToggle.addEventListener('change', () => {
            const active = dndToggle.checked;
            document.body.classList.toggle('dnd-active', active);
            statusIcon.textContent = active ? '🌙' : '☀️';
            statusText.textContent = active ? 'Silencioso ativado' : 'Notificações ativadas';
        });

        function setLogPlaceholder(message) {
            const placeholder = document.createElement('p');
            placeholder.className = 'empty-log';
            placeholder.textContent = message;
            logBox.replaceChildren(placeholder);
        }

        function simulateNotification(sender, message, isVip, isUrgent) {
            const dndActive = dndToggle.checked;
            const vipAllowed = allowVipCheckbox.checked && isVip;
            const urgentAllowed = allowUrgentCheckbox.checked && isUrgent;
            const shouldNotify = !dndActive || vipAllowed || urgentAllowed;

            if (!hasLogEntries) {
                logBox.replaceChildren();
                hasLogEntries = true;
            }

            const time = new Date().toLocaleTimeString('pt-BR', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            const item = document.createElement('div');
            item.className = `log-item ${shouldNotify ? 'allowed' : 'blocked'}`;
            const heading = document.createElement('strong');
            heading.textContent = `${shouldNotify ? '🔔' : '🔕'} [${time}] ${sender}: `;
            const detail = document.createElement('span');
            detail.textContent = shouldNotify ? message : 'Silenciada pelo Não Perturbe';
            item.append(heading, detail);
            logBox.prepend(item);
        }

        document.querySelectorAll('[data-sender]').forEach((button) => {
            button.addEventListener('click', () => {
                simulateNotification(
                    button.dataset.sender,
                    button.dataset.message,
                    button.dataset.vip === 'true',
                    button.dataset.urgent === 'true'
                );
            });
        });

        document.getElementById('clear-log').addEventListener('click', () => {
            hasLogEntries = false;
            setLogPlaceholder('Histórico limpo.');
        });
    </script>
</body>
</html>
