<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Magnitude | Buuro</title>
    <script src="game-language.js" defer></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --blue: #38bdf8;
            --red: #f43f5e;
            --success: #22c55e;
            --gold: #f5c542;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background: radial-gradient(circle at top, #1e293b, #0f172a 70%);
            color: var(--text);
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        .game {
            width: min(100%, 760px);
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
        }

        h1 {
            margin: 0;
            color: var(--blue);
            letter-spacing: 2px;
        }

        .subtitle { color: var(--muted); margin: 6px 0 14px; }

        .hud {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 16px;
            border: 1px solid #334155;
            border-radius: 12px;
            background: rgba(30, 41, 59, 0.9);
            font-weight: 700;
        }

        .arena {
            height: 340px;
            margin-top: 16px;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            position: relative;
            overflow: hidden;
            padding: 24px 16px 48px;
            border: 2px solid #334155;
            border-radius: 16px;
            background: var(--card);
        }

        .ground {
            position: absolute;
            left: 0;
            bottom: 48px;
            width: 100%;
            height: 2px;
            background: #64748b;
        }

        .item {
            width: 44%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            position: relative;
        }

        .shape {
            height: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            transition: height 0.08s linear;
        }

        .shape svg {
            width: auto;
            height: 100%;
            display: block;
        }

        .reference svg { fill: var(--blue); }
        .target svg { fill: var(--red); }

        .ghost {
            position: absolute;
            bottom: 0;
            display: none;
            opacity: 0.35;
        }

        .ghost svg { fill: var(--success); }

        .label {
            position: absolute;
            bottom: -38px;
            width: 100%;
            color: var(--muted);
            font-size: 0.86rem;
            text-align: center;
        }

        .label strong {
            display: block;
            color: var(--text);
        }

        .controls {
            display: grid;
            gap: 14px;
            margin-top: 16px;
            padding: 18px;
            border-radius: 16px;
            background: var(--card);
        }

        .feedback {
            min-height: 24px;
            text-align: center;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--muted);
            font-size: 0.85rem;
        }

        input[type="range"] {
            flex: 1;
            height: 8px;
            accent-color: var(--red);
            cursor: pointer;
        }

        button {
            min-height: 46px;
            border: 0;
            border-radius: 10px;
            background: var(--gold);
            color: #171717;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }

        button:hover { filter: brightness(1.08); }

        .music-button {
            background: #0e7490;
            color: #fff;
        }

        .music-status {
            min-height: 20px;
            color: var(--muted);
            text-align: center;
            font-size: 0.85rem;
        }

        .next-button {
            display: none;
            background: var(--success);
            color: #fff;
        }

        .menu-button {
            width: 100%;
            margin-top: 10px;
            background: #334155;
            color: #fff;
        }

        .game-over {
            display: none;
            margin-top: 16px;
            padding: 28px;
            text-align: center;
            border-radius: 16px;
            background: var(--card);
        }

        .final-score {
            margin: 12px 0;
            color: var(--blue);
            font-size: 3rem;
            font-weight: 900;
        }

        @media (max-width: 520px) {
            body { padding: 10px; }
            .arena { height: 280px; }
            .hud { font-size: 0.82rem; }
        }
    </style>
    <link rel="stylesheet" href="site-preferences.css">
    <script src="site-preferences.js"></script>
</head>
<body>
    <main class="game">
        <header>
            <h1>MAGNITUDE</h1>
            <p class="subtitle" data-explanatory-text>Ajuste o objeto vermelho em relação à referência azul. Os desafios mudam a cada partida.</p>
            <div class="hud">
                <span>Rodada: <strong id="round-num">1 / 10</strong></span>
                <span>Pontos: <strong id="total-score">0 / 1000</strong></span>
            </div>
        </header>

        <section id="game-area">
            <div class="arena">
                <div class="ground"></div>
                <div class="item">
                    <div class="shape reference" id="reference-shape"></div>
                    <div class="label"><strong id="reference-name"></strong><span id="reference-size"></span></div>
                </div>
                <div class="item">
                    <div class="shape ghost" id="ghost-shape"></div>
                    <div class="shape target" id="target-shape"></div>
                    <div class="label"><strong id="target-name"></strong><span id="target-size"></span></div>
                </div>
            </div>

            <div class="controls">
                <div class="feedback" id="feedback">Use o controle para ajustar o tamanho</div>
                <button type="button" class="music-button" id="music-toggle" aria-pressed="false">Tocar trilha sonora</button>
                <div class="music-status" id="music-status" role="status" aria-live="polite"></div>
                <div class="slider-row">
                    <span>Menor</span>
                    <input type="range" id="size-slider" min="15" max="260" value="100" aria-label="Tamanho do objeto">
                    <span>Maior</span>
                </div>
                <button type="button" id="guess-button">Confirmar tamanho</button>
                <button type="button" id="next-button" class="next-button">Próxima rodada</button>
            </div>
        </section>

        <section class="game-over" id="game-over">
            <h2>Desafio concluído!</h2>
            <div class="final-score" id="final-score">0 / 1000</div>
            <button type="button" id="restart-button">Jogar novamente</button>
        </section>

        <button type="button" class="menu-button" id="menu-button">Retornar ao menu</button>
    </main>
    <audio id="background-music" src="vidssave.com%20Brawl%20Stars%20OST%20_%20Season%2026%20_%20Godzilla%20_%20Menu%20Music%20256KBPS.mp3" loop preload="none"></audio>

            'Pirâmide de Quéops': ['Great Pyramid of Giza', 'Pirámide de Keops', 'Cheops-Pyramide', 'Pirâmide de Quéops', 'クフ王のピラミッド', 'Пирамида Хеопса', 'Pyramide de Khéops', 'Piramide di Cheope'],
            'Turbina eólica': ['Wind turbine', 'Turbina eólica', 'Windkraftanlage', 'Turbina eólica', '風力タービン', 'Ветряная турбина', 'Éolienne', 'Turbina eolica'],
            'Big Ben': ['Big Ben', 'Big Ben', 'Big Ben', 'Big Ben', 'ビッグ・ベン', 'Биг-Бен', 'Big Ben', 'Big Ben'],
            'Foguete': ['Rocket', 'Cohete', 'Rakete', 'Foguete', 'ロケット', 'Ракета', 'Fusée', 'Razzo'],
            'Monte Everest': ['Mount Everest', 'Monte Everest', 'Mount Everest', 'Monte Everest', 'エベレスト', 'Эверест', 'Mont Everest', 'Monte Everest'],
            'Palmeira alta': ['Tall palm tree', 'Palmera alta', 'Hohe Palme', 'Palmeira alta', '高いヤシの木', 'Высокая пальма', 'Grand palmier', 'Palma alta']
        };
        const ROUND_LOCALES = ['en', 'es', 'de', 'pt-BR', 'ja', 'ru', 'fr', 'it'];
        const REVEAL_TRANSLATIONS = {
            about: ['about', 'aproximadamente', 'etwa', 'cerca de', '約', 'около', 'environ', 'circa'],
            originally: ['originally', 'originalmente', 'ursprünglich', 'originalmente', '当初', 'изначально', 'à l’origine', 'originariamente'],
            height: ['in height', 'de altura', 'hoch', 'de altura', 'の高さ', 'высотой', 'de hauteur', 'di altezza'],
            altitude: ['above sea level', 'de altitud', 'über dem Meeresspiegel', 'de altitude', '標高', 'над уровнем моря', 'd’altitude', 'di altitudine']
        };

        function selectedLocale() {
            const locale = localStorage.getItem('buuro-language-v1');
            return ROUND_LOCALES.includes(locale) ? locale : 'pt-BR';
        }

        function localizedObjectName(name) {
            const translations = ROUND_NAME_TRANSLATIONS[name];
            return translations ? translations[ROUND_LOCALES.indexOf(selectedLocale())] : name;
        }

        function localizedReveal(reveal) {
            const translations = REVEAL_TRANSLATIONS;
            const locale = selectedLocale();
            const localeIndex = ROUND_LOCALES.indexOf(locale);
            if (locale === 'ja') {
                const localized = reveal.replace(/^cerca de /, `${translations.about[localeIndex]} `);
                if (localized.endsWith(' de altitude')) {
                    return `標高 ${localized.slice(0, -' de altitude'.length)}`;
                }
                if (localized.endsWith(' originalmente')) {
                    return `当初 ${localized.slice(0, -' originalmente'.length)}`;
                }
                if (localized.endsWith(' de altura')) {
                    return `${localized.slice(0, -' de altura'.length)} の高さ`;
                }
                return localized;
            }
            return reveal
                .replace(/^cerca de /, `${translations.about[localeIndex]} `)
                .replace(/ originalmente$/, ` ${translations.originally[localeIndex]}`)
                .replace(/ de altura$/, ` ${translations.height[localeIndex]}`)
                .replace(/ de altitude$/, ` ${translations.altitude[localeIndex]}`);
        }

        const ROUNDS_PER_GAME = 10;
        let roundIndex = 0;
        let rounds = [];
        let totalScore = 0;
        let roundPointsAdded = 0;
        let locked = false;
        let correctHeight = 0;
        const maxScore = ROUNDS_PER_GAME * 100;

        const roundNumber = document.getElementById('round-num');
        const totalScoreElement = document.getElementById('total-score');
        const referenceShape = document.getElementById('reference-shape');
        const targetShape = document.getElementById('target-shape');
        const ghostShape = document.getElementById('ghost-shape');
        const referenceName = document.getElementById('reference-name');
        const targetName = document.getElementById('target-name');
        const referenceSize = document.getElementById('reference-size');
        const targetSize = document.getElementById('target-size');
        const slider = document.getElementById('size-slider');
        const feedback = document.getElementById('feedback');
        const guessButton = document.getElementById('guess-button');
        const nextButton = document.getElementById('next-button');
        const backgroundMusic = document.getElementById('background-music');
        const musicToggle = document.getElementById('music-toggle');
        const musicStatus = document.getElementById('music-status');

        musicToggle.addEventListener('click', async () => {
            if (backgroundMusic.paused) {
                try {
                    await backgroundMusic.play();
                    musicToggle.textContent = 'Pausar trilha sonora';
                    musicToggle.setAttribute('aria-pressed', 'true');
                    musicStatus.textContent = 'Trilha sonora ativada.';
                } catch (error) {
                    musicStatus.textContent = 'Não foi possível reproduzir a trilha sonora. Verifique se o arquivo está disponível.';
                }
                return;
            }

            backgroundMusic.pause();
            musicToggle.textContent = 'Tocar trilha sonora';
            musicToggle.setAttribute('aria-pressed', 'false');
            musicStatus.textContent = 'Trilha sonora pausada.';
        });

        function loadRound() {
            locked = false;
            roundPointsAdded = 0;
            const round = rounds[roundIndex];
            const maxHeight = 260;
            const largest = Math.max(round.reference.size, round.target.size);
            const pixelsPerMeter = (maxHeight * 0.85) / largest;
            const referenceHeight = Math.max(18, round.reference.size * pixelsPerMeter);
            correctHeight = round.target.size * pixelsPerMeter;

            roundNumber.textContent = `${roundIndex + 1} / ${rounds.length}`;
            totalScoreElement.textContent = `${totalScore} / ${maxScore}`;
            feedback.textContent = 'Use o controle para ajustar o tamanho';
            updateRoundLabels();
            referenceSize.textContent = '';
            targetSize.textContent = '';
            referenceShape.innerHTML = round.reference.shape;
            targetShape.innerHTML = round.target.shape;
            ghostShape.innerHTML = round.target.shape;
            referenceShape.style.height = `${referenceHeight}px`;
            targetShape.style.height = '100px';
            ghostShape.style.height = `${correctHeight}px`;
            ghostShape.style.display = 'none';
            slider.value = '100';
            slider.disabled = false;
            guessButton.style.display = 'block';
            nextButton.style.display = 'none';
        }

        function updateRoundLabels() {
            if (!rounds.length) return;
            const round = rounds[roundIndex];
            referenceName.textContent = localizedObjectName(round.reference.name);
            targetName.textContent = localizedObjectName(round.target.name);
            if (locked) {
                referenceSize.textContent = localizedReveal(round.reference.reveal);
                targetSize.textContent = localizedReveal(round.target.reveal);
            }
        }

        function shuffle(items) {
            const shuffled = [...items];
            for (let index = shuffled.length - 1; index > 0; index--) {
                const randomIndex = Math.floor(Math.random() * (index + 1));
                [shuffled[index], shuffled[randomIndex]] = [shuffled[randomIndex], shuffled[index]];
            }
            return shuffled;
        }

        function startGame() {
            rounds = shuffle(ROUND_POOL).slice(0, ROUNDS_PER_GAME);
            roundIndex = 0;
            totalScore = 0;
            document.getElementById('game-area').style.display = 'block';
            document.getElementById('game-over').style.display = 'none';
            loadRound();
        }

        slider.addEventListener('input', () => {
            if (!locked) targetShape.style.height = `${slider.value}px`;
        });

        guessButton.addEventListener('click', () => {
            if (locked) return;
            locked = true;
            slider.disabled = true;
            const guess = Number(slider.value);
            const difference = Math.abs(guess - correctHeight);
            const accuracy = Math.max(0, 1 - difference / correctHeight);
            roundPointsAdded = Math.round(accuracy * 100);
            totalScore += roundPointsAdded;

            ghostShape.style.display = 'flex';
            targetSize.textContent = localizedReveal(rounds[roundIndex].target.reveal);
            referenceSize.textContent = localizedReveal(rounds[roundIndex].reference.reveal);
            feedback.textContent = accuracy >= 0.9
                ? `Excelente! Precisão de ${Math.round(accuracy * 100)}%.`
                : `Boa tentativa! Precisão de ${Math.round(accuracy * 100)}%.`;
            totalScoreElement.textContent = `${totalScore} / ${maxScore}`;
            guessButton.style.display = 'none';
            nextButton.style.display = 'block';

            if (window.GameScoreCounter) {
                window.GameScoreCounter.add('magnitude', roundPointsAdded);
            }
        });

        nextButton.addEventListener('click', () => {
            roundIndex++;
            if (roundIndex >= rounds.length) {
                document.getElementById('game-area').style.display = 'none';
                document.getElementById('game-over').style.display = 'block';
                document.getElementById('final-score').textContent = `${totalScore} / ${maxScore}`;
                return;
            }
            loadRound();
        });

        window.addEventListener('buuro-language-changed', updateRoundLabels);
        window.addEventListener('storage', (event) => {
            if (event.key === 'buuro-language-v1' || event.key === null) updateRoundLabels();
        });

        document.getElementById('restart-button').addEventListener('click', startGame);

        document.getElementById('menu-button').addEventListener('click', () => {
            window.location.href = 'index.html?menu=1#menu-container';
        });

        startGame();
    </script>
</body>
</html>
